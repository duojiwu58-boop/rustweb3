[workspace]
members = ["crates/wallet-ipc", "crates/wallet-signer", "crates/wallet-network", "crates/wallet-ffi", "crates/wallet-core", "crates/chain-evm", "crates/chain-tron", "crates/chain-solana", "crates/wallet-secrets", "crates/wallet-sandbox", "crates/wallet-services", "crates/wallet-journal"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
sha3 = { version = "=0.10.8", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
bs58 = { version = "=0.5.1", default-features = false, features = ["std", "check"] }
rlp = { version = "=0.5.2", default-features = false, features = ["std"] }
prost = { version = "=0.14.4", default-features = false, features = ["std", "derive"] }
hex = "=0.4.3"

[profile.release]
panic = "unwind"

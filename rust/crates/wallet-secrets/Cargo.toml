[package]
name = "wallet-secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bip32 = { version = "=0.6.0", default-features = false, features = ["alloc", "secp256k1"] }
chain-evm = { path = "../chain-evm" }
chain-tron = { path = "../chain-tron" }
chain-solana = { path = "../chain-solana" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
hmac = "=0.12.1"
sha2.workspace = true
bs58.workspace = true
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
zeroize = { version = "=1.9.1", features = ["alloc"] }
wallet-core = { path = "../wallet-core" }
wallet-journal = { path = "../wallet-journal" }
hex.workspace = true

[dev-dependencies]
